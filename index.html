<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Core Interface</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #030712; color: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .agent-container { max-width: 950px; width: 100%; background: #0f172a; padding: 30px; border-radius: 16px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); border: 1px solid #1e293b; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .status-bar { text-align: center; color: #10b981; font-size: 14px; margin-bottom: 30px; font-weight: bold; text-transform: uppercase; animation: blink 2s infinite; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #94a3b8; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        input, textarea, button { width: 100%; padding: 14px; margin-bottom: 22px; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; font-size: 16px; }
        input, textarea { background-color: #020617; color: #38bdf8; font-family: 'Courier New', Courier, monospace; }
        button { background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background-color: #0369a1; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .output-panel { background: #020617; padding: 25px; border-radius: 8px; border-left: 5px solid #10b981; white-space: pre-wrap; display: block; margin-top: 20px; line-height: 1.6; font-size: 15px; color: #e2e8f0; }
        .loading { display: none; text-align: center; color: #f59e0b; font-weight: bold; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="agent-container">
    <h1>JARVIS: Autonomous Core</h1>
    <div class="status-bar">● GEMINI ENGINE SYSTEM ONLINE</div>
    
    <label for="apiKey">1. Security Layer: Google Gemini API Key (AI Studio)</label>
    <input type="password" id="apiKey" placeholder="AI Studio se free key lekar yahan paste karein...">

    <label for="command">2. System Objective / Prompt Command</label>
    <textarea id="command" rows="5">Sir, I need conversion-optimized product listing for a digital 'AI Productivity Notion Template'. Include title, bulletproof description, pricing psychology, and Pinterest hashtags.</textarea>

    <button onclick="executeAgent()">Deploy AI Agent (Execute Task)</button>

    <div class="loading" id="loadingBar">⚡ JARVIS IS COMMUNICATING WITH GEMINI CORE COGNITION SERVICE...</div>
    <div class="output-panel" id="outputBox">Awaiting execution command from Sir...</div>
</div>

<script>
    async function executeAgent() {
        const key = document.getElementById('apiKey').value.trim();
        const userCommand = document.getElementById('command').value;
        const outputBox = document.getElementById('outputBox');
        const loadingBar = document.getElementById('loadingBar');

        if(!key) { alert('Sir, please provide your Gemini API Key!'); return; }

        loadingBar.style.display = 'block';
        outputBox.innerText = "System loading...";

        const masterAgentPrompt = `You are JARVIS, my supreme Autonomous AI Business Manager. Address me as 'Sir'. Analyze and execute this instruction with absolute truth and strategy: ${userCommand}`;

        try {
            // Direct Native Call to Gemini API without any OpenAI confusion
            const url = `https://googleapis.com{key}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: masterAgentPrompt }] }] })
            });

            const data = await response.json();
            
            if (data.error) {
                outputBox.innerText = "API Error, Sir: " + data.error.message;
            } else {
                const resultText = data.candidates[0].content.parts[0].text;
                outputBox.innerText = resultText;
            }
        } catch (error) {
            outputBox.innerText = "Execution failed, Sir. Check internet connection or key structure.";
        } finally {
            loadingBar.style.display = 'none';
        }
    }
</script>

</body>
</html>
