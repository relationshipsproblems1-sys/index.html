<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Insaani Aawaz Agent</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #030712; color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        .agent-container { max-width: 700px; width: 100%; background: #0f172a; padding: 40px; border-radius: 24px; box-shadow: 0 0 35px rgba(56, 189, 248, 0.25); border: 2px solid #1e293b; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); font-size: 28px; }
        .status-bar { color: #10b981; font-size: 14px; margin-bottom: 40px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .mic-container { margin-bottom: 30px; }
        .main-btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; font-weight: bold; padding: 20px 40px; font-size: 18px; border-radius: 50px; border: none; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); width: 80%; }
        .main-btn:hover { transform: scale(1.03); box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); }
        .mic-active { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important; animation: pulse 1.5s infinite; }
        .output-panel { background: #020617; padding: 25px; border-radius: 12px; margin-top: 30px; line-height: 1.6; font-size: 16px; color: #38bdf8; border: 1px solid #334155; font-family: 'Courier New', monospace; text-align: left; max-height: 200px; overflow-y: auto; }
        .hidden-fields { display: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="agent-container">
    <h1>JARVIS CORE</h1>
    <div class="status-bar" id="statusText">● READY FOR VOICE COMMANDS, SIR</div>

    <div class="mic-container">
        <button class="main-btn" id="actionBtn" onclick="toggleVoiceSystem()">🎙️ TALK TO JARVIS (BAAT KAREIN)</button>
    </div>

    <div class="hidden-fields">
        <textarea id="command"></textarea>
    </div>

    <div class="output-panel" id="outputBox">JARVIS Statement: Standing by for your voice command, Sir. Click the button above and speak.</div>
</div>

<script>
    let synth = window.speechSynthesis;
    let recognition;
    let isListening = false;

    // Voice Recognition Setup
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function() {
            isListening = true;
            document.getElementById('actionBtn').classList.add('mic-active');
            document.getElementById('actionBtn').innerText = "🛑 LISTENING TO SIR...";
            document.getElementById('statusText').innerText = "● JARVIS IS IS LISTENING TO YOUR VOICE...";
            if (synth.speaking) { synth.cancel(); }
        };

        recognition.onerror = function(event) {
            resetUI();
            document.getElementById('outputBox').innerText = "System Mic Error, Sir. Please try again.";
        };

        recognition.onend = function() {
            isListening = false;
            document.getElementById('actionBtn').classList.remove('mic-active');
            document.getElementById('actionBtn').innerText = "⚡ PROCESSING VALUE...";
        };

        recognition.onresult = function(event) {
            const voiceText = event.results[0][0].transcript;
            document.getElementById('command').value = voiceText;
            document.getElementById('outputBox').innerText = "Sir Said: \"" + voiceText + "\"";
            executeAgentPayload(voiceText);
        };
    } else {
        alert("Sir, your browser does not support Voice Recognition. Please use Google Chrome.");
    }

    function toggleVoiceSystem() {
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    function resetUI() {
        isListening = false;
        document.getElementById('actionBtn').classList.remove('mic-active');
        document.getElementById('actionBtn').innerText = "🎙️ TALK TO JARVIS (BAAT KAREIN)";
        document.getElementById('statusText').innerText = "● READY FOR VOICE COMMANDS, SIR";
    }

    // JARVIS Speak Action
    function jarvisSpeak(text) {
        if (synth.speaking) { synth.cancel(); }
        let cleanText = text.replace(/[#*`_]/g, '');
        let utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.0; 
        utterance.pitch = 0.85; // Deep Male Corporate Assistant Voice
        
        utterance.onend = function() {
            resetUI();
        };
        
        synth.speak(utterance);
    }

    // Processing Agent Engine
    async function executeAgentPayload(commandText) {
        document.getElementById('statusText').innerText = "● JARVIS IS THINKING AND COGNITING...";
        const outputBox = document.getElementById('outputBox');

        try {
            const response = await fetch("https://huggingface.co", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    inputs: `<|system|>\nYou are JARVIS, a supreme AI Personal Business Partner. Always address the user as 'Sir'. Always start your response with 'Yes Sir'. Keep your response precise, highly professional, direct, and under 3-4 sentences so it sounds like a real short spoken answer.\n<|user|>\n${commandText}\n<|assistant|>\n`
                })
            });

            const data = await response.json();
            
            if (data && data.generated_text) {
                const fullText = data.generated_text;
                const parts = fullText.split("<|assistant|>");
                const cleanResult = parts[parts.length - 1].trim();
                
                outputBox.innerText = cleanResult;
                jarvisSpeak(cleanResult);
            } else if (data.error) {
                let errStr = "Server node is waking up, Sir. Please trigger me again in 5 seconds.";
                outputBox.innerText = errStr;
                jarvisSpeak(errStr);
                resetUI();
            }
        } catch (error) {
            outputBox.innerText = "Connection break, Sir. Try again.";
            resetUI();
        }
    }
</script>

</body>
</html>
